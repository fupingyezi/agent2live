name: api-docs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:openapi
      - name: Import to Apifox
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
          APIFOX_PROJECT_ID: ${{ secrets.APIFOX_PROJECT_ID }}
        run: |
          if [ -z "$APIFOX_ACCESS_TOKEN" ] || [ -z "$APIFOX_PROJECT_ID" ]; then
            echo "APIFOX_ACCESS_TOKEN / APIFOX_PROJECT_ID 未配置，跳过导入。"
            exit 0
          fi
          pnpm api:apifox
