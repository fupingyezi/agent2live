packages:
  - 'apps/*'
  - 'packages/*'
  - 'workers/*'

# pnpm 11 replaced onlyBuiltDependencies with allowBuilds. The plan's baseline
# list is kept below for traceability; allowBuilds is the setting pnpm reads.
allowBuilds:
  electron: true
  better-sqlite3: true
  sharp: true
  esbuild: true
  electron-winstaller: false

onlyBuiltDependencies:
  - electron
  - better-sqlite3
  - sharp
  - esbuild
